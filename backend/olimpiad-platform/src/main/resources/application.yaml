spring:
  application:
    name: olympiad-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/olympiad_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:c2VjcmV0LWtleS1mb3Itam93YW5uLW9seW1waWFkLXBsYXRmb3JtLTIwMjYtc3VwZXItc2VjdXJlLWtleQo=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:86400000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  judge0:
    url: ${JUDGE0_URL:https://ce.judge0.com}
  calendar:
    nager-date-url: ${NAGER_DATE_URL:https://date.nager.at}
  upload:
    dir: ./uploads
    max-size: 10485760
    allowed-types: image/jpeg,image/png,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

logging:
  level:
    com.olympiadplatform: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
